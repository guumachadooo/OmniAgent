name: Build OmniAgent Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  omniagent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Zero-Static Coherence Gate (--local)
        run: python3 -B .agents/plugins/dynamic-fractal-planner/scripts/plan_tool.py coherence check --local

      - name: Zero-Quota Sync Cavernize One UI 9 Design Kit
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          from datetime import datetime, timezone

          raw_base = "https://raw.githubusercontent.com/guumachadooo/Cavern/master"
          targets = [
              ("CavernSamples/CavernizeAndroid/Theme/OneUiTheme.cs", "OmniAgentAndroid/SharedOneUi/OneUiTheme.cs"),
              ("CavernSamples/CavernizeAndroid/Views/OneUiIconView.cs", "OmniAgentAndroid/SharedOneUi/OneUiIconView.cs"),
              ("CavernSamples/CavernizeAndroid/Views/OneUiComponents.cs", "OmniAgentAndroid/SharedOneUi/OneUiComponents.cs"),
              ("CavernSamples/CavernizeAndroid/Assets/fonts/sf_pro_android_ui.ttf", "OmniAgentAndroid/Assets/fonts/sf_pro_android_ui.ttf"),
          ]
          h = hashlib.sha256()
          synced = 0
          for src, dst in targets:
              dst_p = pathlib.Path(dst)
              dst_p.parent.mkdir(parents=True, exist_ok=True)
              try:
                  req = urllib.request.Request(f"{raw_base}/{src}", headers={"User-Agent": "OmniAgent-DesignSync/2.1"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = r.read()
                  if data:
                      dst_p.write_bytes(data)
                      synced += 1
              except Exception as exc:
                  print(f"[design-sync] Fallback to committed {dst}: {exc}")
              if dst_p.exists():
                  h.update(dst_p.read_bytes())

          fp = h.hexdigest()[:12]
          ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          manifest = (
              "namespace OmniAgentAndroid.SharedOneUi;\n\n"
              "/// <summary>\n"
              "/// Auto-generated zero-quota manifest tracking the exact Cavernize One UI 9 Design Kit\n"
              "/// synced into OmniAgentAndroid via Federation mirrors / BuildOmniAgent.yml CI.\n"
              "/// </summary>\n"
              "public static class OneUiDesignKitManifest {\n"
              "    public const string SourceRepo = \"guumachadooo/Cavern\";\n"
              "    public const string SourceBranch = \"master\";\n"
              f"    public const string KitFingerprint = \"{fp}\";\n"
              f"    public const string SyncedAtUtc = \"{ts}\";\n"
              "}\n"
          )
          pathlib.Path("OmniAgentAndroid/SharedOneUi/OneUiDesignKitManifest.cs").write_text(manifest, encoding="utf-8")
          print(f"[design-sync] synced={synced}/{len(targets)} fingerprint={fp}")
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        run: |
          dotnet build OmniAgentAndroid/OmniAgentAndroid.csproj \
            -t:InstallAndroidDependencies -f net11.0-android -c Release \
            -p:AcceptAndroidSDKLicenses=true

      - name: Restore shared release signing keystore (Cavernize same-signature IPC)
        run: |
          base64 -d .github/signing/cavernize.keystore.b64 > "$GITHUB_WORKSPACE/cavernize.p12"
          keytool -importkeystore \
            -srckeystore "$GITHUB_WORKSPACE/cavernize.p12" -srcstoretype PKCS12 -srcstorepass cavernize \
            -destkeystore "$GITHUB_WORKSPACE/cavernize.keystore" -deststoretype PKCS12 -deststorepass cavernize \
            -destkeypass cavernize -noprompt

      - name: Build & sign OmniAgent Android APK (Release)
        run: |
          VER_CODE=$(($(date +%s) / 60))
          dotnet publish OmniAgentAndroid/OmniAgentAndroid.csproj \
            -f net11.0-android -c Release \
            -p:ApplicationVersion="$VER_CODE" \
            -p:ApplicationDisplayVersion="2.1.${{ github.run_number }}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/cavernize.keystore" \
            -p:AndroidSigningKeyAlias=cavernize \
            -p:AndroidSigningKeyPass=cavernize \
            -p:AndroidSigningStorePass=cavernize \
            -o "$RUNNER_TEMP/omniagent_out"
          SIGNED_APK=$(find "$RUNNER_TEMP/omniagent_out" -name "*-Signed.apk" | head -n 1)
          if [ -z "$SIGNED_APK" ]; then
            SIGNED_APK=$(find "$RUNNER_TEMP/omniagent_out" -name "*.apk" | head -n 1)
          fi
          cp "$SIGNED_APK" "$RUNNER_TEMP/OmniAgent-Android.apk"
          ls -lh "$RUNNER_TEMP/OmniAgent-Android.apk"

      - name: Upload OmniAgent APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniAgent-Android-APK
          path: ${{ runner.temp }}/OmniAgent-Android.apk

      - name: Publish versioned OmniAgent GitHub Release (auto-advancing Latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: OmniAgent v2.1.${{ github.run_number }}
          body: |
            Signed release for **OmniAgent Companion `v2.1.${{ github.run_number }}`** (Build `#${{ github.run_number }}`, commit `${{ github.sha }}`).
            - **Zero-Quota Cavernize One UI 9 Design Inheritance:** Auto-synced `OneUiTheme`, `OneUiIconView`, `OneUiComponents`, & SF Pro directly from `guumachadooo/Cavern@master` + live `<10 ms` runtime token sync.
            - **Zero-Click Always-On Automation & Cold-Wake:** Auto-starts on launch/boot/update with persisted 15m JobScheduler watchdog, `OnTaskRemoved` quick-restart, Cavernize launch wake, and Debian daemon Smart Knock wake.
            - **Native System Biometric Overlay (Zero App Window) + StrongBox/TEE Hardware ECDSA:** Invisible translucent host invokes Android/Samsung's native `BiometricPrompt` sheet directly over any app with hardware-bound asymmetric signing.
            - **Triad Command Hub & Local Debian/Termux Explorer:** Live 3-repo status (`Cavern`, `OmniAgent`, `dynamic-fractal-planner`), zero-quota Doc Reader, 1-tap APK updater, and authenticated `127.0.0.1` loopback file browser.
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/OmniAgent-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling omniagent-latest OTA alias
        uses: softprops/action-gh-release@v3
        with:
          tag_name: omniagent-latest
          name: OmniAgent v2.1.${{ github.run_number }} (OTA Alias)
          prerelease: false
          make_latest: false
          files: ${{ runner.temp }}/OmniAgent-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
